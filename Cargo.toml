[package]
name = "hncli"
version = "0.4.0"
authors = ["pierreyoda <pierreyoda@users.noreply.github.com>"]
edition = "2024"
categories = ["command-line-utilities"]
description = "A modern TUI for browsing Hacker News."
homepage = "https://www.hncli.newstackwhodis.com/"
license = "MIT"
repository = "https://github.com/pierreyoda/hncli"

[profile.release]
strip = true    # strip symbols from binary
opt-level = "z" # optimize for binary size
lto = true      # enable Link Time Optimization

[dependencies]
async-recursion = "1.1.1"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
html2text = "0.17.1"
log = "0.4.34"
num-traits = "0.2.19"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simplelog = "0.12.2"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = { version = "1.1.6", features = ["serde"] }
unicode-width = "0.2.2"
url = "2.5.8"
webbrowser = "1.2.4"
